<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c7e3f6" />
    <title>Not In My Shop</title>
    <link rel="icon" href="/assets/ui/favicon.ico" type="image/x-icon" />
    <style>
      #boot-screen {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 50% 38%, #34405c 0%, #20283e 62%);
        color: #ffffff;
        font-family: system-ui, sans-serif;
        text-align: center;
        opacity: 1;
        transition: opacity 0.45s ease;
      }

      #boot-screen.is-done {
        opacity: 0;
        pointer-events: none;
      }

      #boot-logo {
        width: min(58vw, 220px);
        height: auto;
        aspect-ratio: 1;
        object-fit: contain;
        animation: boot-float 2.6s ease-in-out infinite;
        filter: drop-shadow(0 12px 0 rgba(32, 40, 62, 0.35));
      }

      #boot-status {
        margin: 22px 0 0;
        font-size: clamp(15px, 4.2vw, 20px);
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      #boot-bar {
        width: min(100%, 280px);
        height: 16px;
        margin-top: 16px;
        border: 3px solid #ffca45;
        border-radius: 999px;
        background: #20283e;
        overflow: hidden;
        box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.25);
      }

      #boot-bar span {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(180deg, #ffe08a 0%, #ffca45 100%);
        transition: width 0.18s linear;
      }

      #boot-bar.is-indeterminate span {
        width: 38%;
        transition: none;
        animation: boot-slide 1.05s ease-in-out infinite;
      }

      #boot-percent {
        margin: 10px 0 0;
        min-height: 1.2em;
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 800;
        color: #ffca45;
      }

      #boot-tip {
        max-width: 34rem;
        margin: 28px 0 0;
        font-size: clamp(14px, 3.8vw, 16px);
        font-weight: 700;
        line-height: 1.35;
      }

      #boot-tip b {
        color: #ffca45;
      }

      #boot-tip-text {
        display: inline;
        opacity: 1;
        transition: opacity 0.28s ease;
      }

      #boot-tip-text.is-out {
        opacity: 0;
      }

      #boot-error {
        margin-top: 18px;
      }

      #boot-error p {
        margin: 0 0 14px;
        font-weight: 700;
      }

      #boot-retry {
        appearance: none;
        border: 3px solid #20283e;
        border-radius: 999px;
        background: #ffca45;
        color: #20283e;
        font: 800 16px system-ui, sans-serif;
        letter-spacing: 0.06em;
        padding: 10px 28px;
        cursor: pointer;
      }

      #boot-screen.is-failed #boot-status,
      #boot-screen.is-failed #boot-bar,
      #boot-screen.is-failed #boot-percent,
      #boot-screen.is-failed #boot-tip {
        display: none;
      }

      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes boot-slide {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(280%); }
      }

      @media (min-width: 800px) {
        #boot-logo {
          width: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-screen" role="status" aria-live="polite" aria-busy="true">
        <img id="boot-logo" src="%BASE_URL%assets/ui/hud/no_in_shop_icon.webp" alt="Not In My Shop" draggable="false" />
        <p id="boot-status">PREPARING YOUR SHOP...</p>
        <div id="boot-bar" class="is-indeterminate"><span></span></div>
        <p id="boot-percent" hidden>0%</p>
        <p id="boot-tip"><b>TIP:</b> <span id="boot-tip-text"></span></p>
        <div id="boot-error" hidden>
          <p>The shop couldn't be prepared.</p>
          <button id="boot-retry" type="button">RETRY</button>
        </div>
      </div>
      <div id="shop-clock">
        <div id="clock-day">DAY 1</div>
        <div id="clock-frame">
          <div id="clock-window">
            <div id="sky-fill-day"></div>
            <div id="sky-fill-evening"></div>
            <div id="sky-fill-night"></div>
            <img id="sky-day" alt="" draggable="false" />
            <img id="sky-evening" alt="" draggable="false" />
            <img id="sky-night" alt="" draggable="false" />
            <canvas id="clock-stars" width="1448" height="1086"></canvas>
            <img id="clock-moon" alt="" draggable="false" />
            <img id="clock-sun" alt="" draggable="false" />
            <div id="cloud-1" class="clock-clouds">
              <img alt="" draggable="false" />
              <img alt="" draggable="false" />
            </div>
            <div id="cloud-2" class="clock-clouds">
              <img alt="" draggable="false" />
              <img alt="" draggable="false" />
            </div>
            <img id="clock-mountains" alt="" draggable="false" />
            <img id="clock-town" alt="" draggable="false" />
          </div>
          <img id="clock-wood" alt="" draggable="false" />
          <img id="clock-plaque-art" alt="" draggable="false" />
          <p id="clock-plaque">9:00 AM</p>
        </div>
      </div>
      <div id="closing-scrim" data-no-joystick hidden></div>
      <div id="closing-announcement" hidden>
        <p>9:00 PM</p>
        <p>SHOP CLOSED</p>
      </div>
      <section id="results-panel" data-no-joystick hidden>
        <div class="results-sheet">
          <header class="results-head">
            <img id="results-moon" class="results-ink" alt="" width="32" height="32" />
            <h2 id="results-day">DAY 1 COMPLETE</h2>
            <p class="results-kicker">SHOP CLOSED</p>
          </header>
          <div class="results-dash"></div>
          <div class="results-stats">
            <div>
              <img id="stat-customers-icon" class="results-ink" alt="" width="28" height="28" />
              <strong id="stat-customers">0</strong>
              <span>CUSTOMERS</span>
            </div>
            <div>
              <img id="stat-checkouts-icon" class="results-ink" alt="" width="28" height="28" />
              <strong id="stat-checkouts">0</strong>
              <span>CHECKOUTS</span>
            </div>
            <div>
              <img id="stat-caught-icon" class="results-ink" alt="" width="28" height="28" />
              <strong id="stat-caught">0</strong>
              <span>CAUGHT</span>
            </div>
          </div>
          <div class="results-dash"></div>
          <div class="results-money">
            <p><span>Checkout Income</span><b id="stat-income">0G</b></p>
            <p><span><img id="stat-escaped-icon" class="results-ink" alt="" width="16" height="16" />Thieves Escaped</span><b id="stat-escaped">0</b></p>
            <p><span>Money Stolen</span><b id="stat-stolen">0G</b></p>
            <p class="is-net"><span>Net Earnings</span><b id="stat-net">0G</b></p>
          </div>
          <div class="results-dash"></div>
          <button id="results-continue" type="button" data-no-joystick>
            <span>CONTINUE</span>
            <span class="results-continue-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </section>
      <div id="money-hud" aria-live="polite">
        <img class="money-coin" src="/assets/ui/hud/coin.webp" alt="" />
        <span id="money-amount">0</span>
        <span id="money-gain" hidden></span>
      </div>
      <button id="settings-button" type="button" aria-label="Settings" data-no-joystick>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" />
        </svg>
      </button>
      <button id="pause-button" type="button" aria-label="Pause" data-no-joystick>
        <span></span>
        <span></span>
      </button>
      <section id="pause-modal" hidden data-no-joystick>
        <h2>Paused</h2>
        <h3>Music</h3>
        <input id="pause-music" type="range" min="0" max="100" value="40" aria-label="Music volume" />
        <h3>Sound Effects</h3>
        <input id="pause-sfx" type="range" min="0" max="100" value="40" aria-label="Sound effects volume" />
        <button id="pause-resume" type="button">Resume Game</button>
        <button id="pause-restart" type="button">Restart Day</button>
        <button id="pause-main-menu" type="button" class="is-quiet">Main Menu</button>
      </section>
      <section id="settings-modal" hidden data-no-joystick>
        <h2>Settings</h2>
        <h3>Music</h3>
        <input id="settings-music" type="range" min="0" max="100" value="40" aria-label="Music volume" />
        <h3>Sound Effects</h3>
        <input id="settings-sfx" type="range" min="0" max="100" value="40" aria-label="Sound effects volume" />
        <button id="settings-close" type="button">Close</button>
      </section>
      <canvas id="game-canvas"></canvas>
      <div id="joystick-zone" aria-hidden="true"></div>
      <div id="debug-overlay" hidden></div>
    </div>
    <svg id="clock-clip-svg" aria-hidden="true">
      <defs>
        <clipPath id="clock-arch" clipPathUnits="objectBoundingBox">
          <path d="M0.4789,0.1538 L0.4188,0.1634 L0.3891,0.1728 L0.3681,0.182 L0.3493,0.1911 L0.3349,0.2001 L0.3204,0.2091 L0.3081,0.2179 L0.2958,0.2268 L0.2857,0.2355 L0.2775,0.2441 L0.2674,0.2527 L0.2593,0.2613 L0.2513,0.2698 L0.2433,0.2785 L0.2372,0.2869 L0.2312,0.2954 L0.2232,0.3038 L0.2173,0.3122 L0.2133,0.3206 L0.2073,0.329 L0.2015,0.3373 L0.1974,0.3458 L0.1934,0.3541 L0.1876,0.3624 L0.1837,0.3707 L0.1797,0.379 L0.1758,0.3872 L0.1719,0.3955 L0.1699,0.4037 L0.166,0.4121 L0.1621,0.4203 L0.1602,0.4285 L0.1563,0.4367 L0.1544,0.4449 L0.1505,0.4531 L0.1486,0.4613 L0.1467,0.4695 L0.1448,0.4778 L0.1429,0.4859 L0.141,0.4941 L0.139,0.5023 L0.1372,0.5104 L0.1352,0.5186 L0.1334,0.5267 L0.1335,0.5348 L0.1315,0.5431 L0.1297,0.5512 L0.1298,0.5593 L0.1299,0.5675 L0.1279,0.5755 L0.128,0.5837 L0.1281,0.5918 L0.1263,0.5999 L0.1264,0.6221 L0.1265,0.6302 L0.1266,0.6383 L0.1267,0.6464 L0.8655,0.6463 L0.8656,0.6383 L0.8657,0.6302 L0.8658,0.6221 L0.8659,0.5998 L0.8641,0.5918 L0.8642,0.5837 L0.8643,0.5755 L0.8623,0.5674 L0.8624,0.5593 L0.8625,0.5512 L0.8607,0.5431 L0.8587,0.5348 L0.8588,0.5267 L0.8569,0.5185 L0.855,0.5104 L0.8531,0.5023 L0.8513,0.4941 L0.8493,0.4859 L0.8474,0.4778 L0.8455,0.4695 L0.8436,0.4613 L0.8417,0.4531 L0.8398,0.4449 L0.8359,0.4367 L0.8339,0.4285 L0.8301,0.4203 L0.8281,0.4121 L0.8242,0.4037 L0.8203,0.3955 L0.8164,0.3872 L0.8145,0.379 L0.8105,0.3707 L0.8046,0.3624 L0.8007,0.3541 L0.7967,0.3458 L0.7907,0.3373 L0.7868,0.329 L0.7809,0.3206 L0.7749,0.3122 L0.7709,0.3039 L0.7649,0.2955 L0.7569,0.287 L0.7509,0.2785 L0.7429,0.2699 L0.7349,0.2614 L0.7267,0.2528 L0.7186,0.2442 L0.7086,0.2356 L0.6984,0.2269 L0.6881,0.2182 L0.6758,0.2094 L0.6611,0.1922 L0.6467,0.1833 L0.628,0.1742 L0.5798,0.1637 L0.5156,0.1538 Z" />
        </clipPath>
      </defs>
    </svg>
    <script>
      (function () {
        var tips = [
          "Keep an eye on suspicious customers. They might be thieves!",
          "Catch thieves with your broom before they escape!",
          "Serve customers quickly to keep your shop running smoothly!",
          "Upgrade your broom to become a better thief catcher!",
          "Every thief who escapes costs you money. Stay alert!"
        ];
        var text = document.getElementById('boot-tip-text');
        var root = document.getElementById('boot-screen');
        if (!text || !root) return;
        var index = Math.floor(Math.random() * tips.length);
        text.textContent = tips[index];
        setInterval(function () {
          if (root.classList.contains('is-done') || root.classList.contains('is-failed') || root.hidden) return;
          var pick = Math.floor(Math.random() * (tips.length - 1));
          if (pick >= index) pick += 1;
          index = pick;
          text.classList.add('is-out');
          setTimeout(function () {
            text.textContent = tips[index];
            text.classList.remove('is-out');
          }, 280);
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
